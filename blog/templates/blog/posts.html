{% extends "base.html" %}
{% load static %}

{% block page_title %}
     {{Post.title}}
{% endblock %}

{% block body_content %}
    <section>
        <h2>{{post.title}}</h2>
        <div>
            {% for tag in tags %}
               <span>{{ tag }}</span>
            {% endfor %}
        </div>
        <article>
            <img src="{% static 'blog/images/'|add:post.image%}" alt ="{{post.title}}" />
            <address>By <a href = "mailto:{{ post.author.email_addr }}" >{{ post.author }}</a></address>
            <div>Posted on<time>{{post.date|date:"d M Y" }}</time></div>
        </article>
    </section>

    <main>
        <p>{{post.content}}</p>
    </main>
{% endblock %}
