{% extends "base.html" %}
{% load static %}

{% block page_title %}
     {{Post.title}}
{% endblock %}

{% block body_content %}
    <section>
        <h2>{{post.title}}</h2>
        <article>
            <img src="{% static 'blog/images/'|add:post.image%}" alt ="{{post.title}}" />
            <div>Posted on<time>{{post.date|date:"d M Y" }}</time></div>
        </article>
    </section>

    <main>
        <p>{{post.content}}</p>
    </main>
{% endblock %}
