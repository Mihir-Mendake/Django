{% extends "base.html" %}
{% load static %}

{% block css_files %}
<link rel="stylesheet" href="{% static 'blog/app.css' %}">
{% endblock %}

{% block page_title %}
All Posts
{% endblock %}

{% block body_content %}
    <section>
        <h2>All My Post</h2>
     <ul>
         {% for blog in blogs %}
            <li>
                <article>
                    <a href="{% url 'blog-post' blog=blog.slug %}">{{ blog.title|capfirst }}</a>
                    <img src="{% static 'blog/images/'|add:blog.image %}" alt="{{ blog.title|capfirst }}" />
                    <div>
                            <p>
                                {{ blog.preview }}
                            </p>
                    </div>
                </article>
            </li>
         {% endfor %}
     </ul>
    </section>
{% endblock %}
