{% extends "base.html" %}
{% load static %}

{% block css_files %}
<link rel="stylesheet" href="{% static 'blog/app.css' %}">
{% endblock %}

{% block page_title %}
All Posts
{% endblock %}

{% block body_content %}
    <section>
        <h2>All My Post</h2>
         {% for blog in blogs %}
            <li><a href="{% url 'blog-post' blog=blog %}">{{ blog|capfirst }}</a></li>
         {% endfor %}
     </ul>
    </section>
{% endblock %}
